# Multiple-choice questions for the tutorial.
#
# One entry per question, keyed by an id you pass to tutolib.runquestion(<id>).
#   prompt   : the question text
#   options  : list of choices shown as radio buttons
#   answer   : index of the correct option (0-based: first option is 0)
#   feedback : shown when the user picks a wrong answer (keep it short, 1-3 lines)
#
# To add a question, just copy a block and bump the id. No Python needed.

1:
  prompt: "In a longitudinal dataset, what does a single *row* usually represent?"
  options:
    - "One patient"
    - "One visit of one patient (a patient x time observation)"
    - "One clinical variable"
  answer: 1
  feedback: >
    Each row is one visit: the same patient appears on several rows, one per
    follow-up time. That repeated-measures structure is exactly what
    disease-progression models exploit.

2:
  prompt: "What does the tau (time-shift) individual parameter capture in a Leaspy model?"
  options:
    - "How fast the subject progresses"
    - "When the subject reaches the population's average disease stage"
    - "The measurement noise for that subject"
  answer: 1
  feedback: >
    Tau is the time-shift, a disease-onset offset: it says *when* a subject
    reaches the average stage. The *speed* of progression is the separate
    parameter xi.

3:
  prompt: "Do you think it has converged? If not, what would you try at first?"
  options:
    - "Revisit the data and verify monotonicity/normalization"
    - "Try a different model (e.g. linear)"
    - "Add more iterations"
  answer: 2
  feedback: >
    It has not converged: the chains are still drifting, they have not reached a
    plateau. Nothing is wrong with the data or the model here, the fit was simply
    stopped too early, after only 1 000 iterations.

4:
  prompt: "We fit three scores. Which value of `source_dimension` is NOT possible?"
  options:
    - "0"
    - "2"
    - "3"
  answer: 2
  feedback: >
    The number of sources must stay strictly below the number of features: with
    3 scores you can only use 0, 1 or 2. Sources describe the directions in which
    subjects deviate from the mean trajectory, and there are at most
    (features - 1) of them.

5:
  prompt: "Both models give a negative BIC. Which one fits better?"
  options:
    - "The one with the BIC closest to zero"
    - "The one with the lowest (most negative) BIC"
    - "You cannot compare, BIC is only valid when positive"
  answer: 1
  feedback: >
    Lower is always better, sign included: -13600 beats -13500. BIC and AIC both
    add a penalty for the number of parameters, so they let you ask whether extra
    sources are actually worth their cost.

6:
  prompt: "On 3 scores, switching from `gaussian-diagonal` to `gaussian-scalar` changes the number of model parameters by:"
  options:
    - "-2"
    - "0"
    - "+1"
  answer: 0
  feedback: >
    A diagonal noise fits one standard deviation per score (3 parameters), a
    scalar one fits a single shared value (1 parameter). Fewer parameters means a
    lighter BIC/AIC penalty, which is why the scalar model can win even if it
    reconstructs the data slightly less well.

7:
  prompt: "What does Leaspy need before it can simulate a new cohort?"
  options:
    - "A fitted (initialized) logistic model"
    - "Only a list of feature names"
    - "One personalized patient"
    - "Only a dataset with the features to simulate"
  answer: 0
  feedback: >
    Simulation samples new individual parameters from the population
    distributions learned during fit, so the model must already be initialized and fitted.
    It does not need any real patient data for the simulation step.

8:
  prompt: "TIME is expressed in years. Which mean visit spacing gives approximately two visits per year?"
  options:
    - "2"
    - "1"
    - "0.5"
  answer: 2
  feedback: >
    Two visits per year means one visit every half year, so
    distance_visit_mean should be 0.5.

9:
  prompt: "Which result best supports good recovery of the simulated individual parameters?"
  options:
    - "Points close to the identity line, with ICC and Pearson r close to 1"
    - "Points forming a horizontal line, with ICC close to 0"
    - "A large difference between the generating and refitted parameters"
  answer: 0
  feedback: >
    Good recovery means that the re-estimated value is close to the known value
    used for simulation. The points then follow the identity line and agreement
    metrics approach 1.

10:
  prompt: "In joint-model data, what does `EVENT_BOOL = 0` mean?"
  options:
    - "The subject can never experience the event"
    - "No event was observed before the subject's censoring time"
    - "The event occurred at the first visit"
  answer: 1
  feedback: >
    Zero denotes right censoring: the subject is known to be event-free only up
    to EVENT_TIME. What happens after that time is unknown.

11:
  prompt: "A subject has nine longitudinal visits. How should their event information appear in the joint dataframe?"
  options:
    - "With one EVENT_TIME and EVENT_BOOL value, repeated identically on all nine rows"
    - "Only on the final visit row, with missing values on the other rows"
    - "With a different EVENT_TIME at every visit"
  answer: 0
  feedback: >
    The event outcome is subject-level even though the dataframe is visit-level.
    Leaspy checks that EVENT_TIME and EVENT_BOOL each have one unique value per
    subject, then extracts that event information once.

12:
  prompt: "If the Weibull shape parameter rho is greater than 1, what does that indicate?"
  options:
    - "The baseline event hazard increases as latent disease age advances"
    - "The baseline event hazard is constant"
    - "All subjects will experience the event at the same age"
  answer: 0
  feedback: >
    For a Weibull survival model, rho greater than 1 corresponds to an increasing
    baseline hazard. Rho equal to 1 gives a constant hazard, while rho below 1
    gives a decreasing hazard.
